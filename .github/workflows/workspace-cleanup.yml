# Fabric Workspace Cleanup
#
# Triggered daily or manually. Deletes THIS repo's vibedata_ephemeral_<repo>_<pr> Fabric
# workspaces whose PR has been closed or no longer exists (fabric_workspace_cleanup.py).

name: Fabric Workspace Cleanup

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  # pull_request_target always reads this workflow from the default branch,
  # firing reliably for all PRs regardless of when they were opened.
  # actions/checkout@v5 defaults to the base-branch ref under this trigger —
  # no untrusted PR code is checked out, so secrets exposure is safe.
  pull_request_target:
    types: [closed]

env:
  PYTHON_VERSION: "3.11"

permissions:
  id-token: write
  contents: read

jobs:
  # Resolves the CI identity's variable names from ci-config.yml — the same
  # indirection pull-request CI uses — so this default-branch workflow reads no CD_* variable.
  load-config:
    runs-on: ubuntu-latest
    outputs:
      azure_tenant_id_var: ${{ steps.parse.outputs.azure_tenant_id_var }}
      azure_client_id_var: ${{ steps.parse.outputs.azure_client_id_var }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install pyyaml --quiet

      - name: Parse ci-config.yml indirection keys
        id: parse
        run: |
          python3 - <<'EOF'
          import os
          import sys

          sys.path.insert(0, ".github/scripts")
          from ci_config import locate_ci_config, parse_ci_config, require_indirection_key

          with open(locate_ci_config()) as f:
              result = parse_ci_config(f.read())

          if not result["ok"]:
              print(f"::error::ci-config.yml parse failed: {result['error']}")
              sys.exit(1)

          names = {}
          for key in ("AZURE_TENANT_ID_VAR", "AZURE_CLIENT_ID_VAR"):
              found = require_indirection_key(result["config"], key)
              if not found["ok"]:
                  print(f"::error::{found['error']}")
                  sys.exit(1)
              names[key.lower()] = found["value"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for key, value in names.items():
                  out.write(f"{key}={value}\n")
          EOF

  cleanup:
    runs-on: ubuntu-latest
    needs: load-config
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install requests pyyaml --quiet

      - name: Login — CI identity
        uses: azure/login@v3
        with:
          tenant-id: ${{ vars[needs.load-config.outputs.azure_tenant_id_var] }}
          client-id: ${{ vars[needs.load-config.outputs.azure_client_id_var] }}
          allow-no-subscriptions: true

      - name: Delete orphaned ephemeral workspaces
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            EXTRA="--pr-number ${{ github.event.pull_request.number }}"
          fi
          python3 .github/scripts/fabric_api.py cleanup --repo "$GITHUB_REPOSITORY" $EXTRA

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-cleanup-audit-${{ github.run_id }}
          path: workspace-cleanup-audit.json
          if-no-files-found: warn
