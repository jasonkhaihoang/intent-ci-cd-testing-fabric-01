# Studio-owned Fabric dbt package manifest (VD-3794). Static pins, no domain
# coordinates. Seeded skip_if_exists — a domain that adds its own packages keeps them.
packages:
  - package: dbt-labs/dbt_utils
    version: ['>=1.3.0', '<2.0.0']
  - package: elementary-data/elementary
    version: ['>=0.15.0', '<1.0.0']
  - package: metaplane/dbt_expectations
    version: ['>=0.10.0', '<1.0.0']
  - package: dbt-labs/dbt_project_evaluator
    version: ['>=1.0.0', '<2.0.0']
  # Fabric Spark adapter overrides for Elementary — required for Elementary
  # macros to compile on dbt-fabricspark. Pulled from the team's git mirror.
  - git: 'https://github.com/accelerate-data/vd-dbt-elementary-fabricspark.git'
    revision: main
