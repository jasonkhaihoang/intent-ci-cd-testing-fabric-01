# Studio-owned vendored copy of accelerate-data/vd-dbt-elementary-fabricspark
# (VD-4728). Vendored because the Fabric dbt job runtime rejects git-URL dbt
# packages outright; a local: package is the run-verified alternative. Seeded
# skip_if_exists — a domain that re-vendors a newer copy keeps it.
name: 'elementary_fabricspark'
version: '0.1.0'
config-version: 2

# This package provides fabricspark adapter support for Elementary
profile: 'default' # Not used, but required

macro-paths: ['macros']

# No models, seeds, or other resources - just macros
